# Cloudflare Pages + Pages Functions Configuration
# Build command (Cloudflare Pages Dashboard / CI): npm run build   (or: bun run build)
# Build output directory: dist
# Functions directory: functions/ (auto-detected by Cloudflare Pages)

name = "civilization-evolution-atlas"
pages_build_output_dir = "dist"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

# Secrets (configure in Cloudflare Pages -> Settings -> Environment Variables / Secrets,
# or via CLI: `npx wrangler pages secret put GEMINI_API_KEY`):
#   - GEMINI_API_KEY (Required for POST /api/chat)
#   - CUSTOM_SYSTEM_PROMPT (Optional system prompt override)

# Cloudflare Workers KV bindings (Production + Local Dev):
[[kv_namespaces]]
binding = "ATLAS_DATA_KV"
id = "25cf4a612fea487a94ba54ab0e927229"

[[kv_namespaces]]
binding = "OSM_CACHE_KV"
id = "8db9692e8e754b119604ef1e2d3cdd19"

# Cloudflare Pages Preview branch deployments (kv_namespaces is non-inheritable across environments):
[env.preview]
[[env.preview.kv_namespaces]]
binding = "ATLAS_DATA_KV"
id = "25cf4a612fea487a94ba54ab0e927229"

[[env.preview.kv_namespaces]]
binding = "OSM_CACHE_KV"
id = "8db9692e8e754b119604ef1e2d3cdd19"
